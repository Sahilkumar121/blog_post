[project]
name = "blog-post"
version = "0.1.0"
description = "A blog post api using fastapi"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
dev = "fastapi dev app/main.py"
